# Mangue OS build profile: ./compile.sh mangueos
BOARD=mangopi-mq
BRANCH=current
RELEASE=trixie
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
KERNEL_BTF=no
COMPRESS_OUTPUTIMAGE=sha,img
VENDOR="mangueos"
VENDORCOLOR="38;5;214"
HOST=mqpro
# Windows shows the boot partition by this name (where mangue-setup.txt lives); fstab uses UUID.
BOOT_FS_LABEL=MANGUEOS
