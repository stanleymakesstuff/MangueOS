# Mangue OS additions to upstream config/sources/families/d1.conf (sourced after it).
case "${BRANCH}" in
	current)
		# Mainline linux-6.18.y from Armbian's default KERNELSOURCE, pinned to a tag below.
		declare -g KERNEL_MAJOR_MINOR="6.18"
		# Pinned (2026-10-12): the default branch:linux-6.18.y moved .55 -> .56 between two builds.
		# Bump deliberately, rebuild, re-test on hardware.
		declare -g KERNELBRANCH="tag:v6.18.56"
		declare -g KERNELPATCHDIR="archive/d1-6.18"
		declare -g LINUXCONFIG="linux-d1-current"
		;;
esac
