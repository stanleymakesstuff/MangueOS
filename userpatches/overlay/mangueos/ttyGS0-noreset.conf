# Mangue OS (B20): systemd 257 takes an exclusive flock on /dev/console while it resets a getty's
# terminal (TTYReset=yes) and writes the reset + size-query sequence to it. With no PC on the OTG port
# that write to ttyGS0 never completes, so the lock is never released and the ttyS0 getty waits on it
# forever: no serial login (first seen as "B20"). No reset here: agetty may still wait on a port nobody
# reads, but it holds no lock, and its output drains once a PC is attached.
[Service]
TTYReset=no
