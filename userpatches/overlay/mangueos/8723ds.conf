# Mangue OS: RTL8723DS Wi-Fi driver options (bug B1, README "Bug hunt").
# - Power saving off (driver defaults rtw_power_mgnt=2 rtw_ips_mode=1); Armbian's r8723bs.conf
#   targets the wrong module name. This alone did NOT fix B1 (recurred 2026-10-13 with it).
# - Driver-internal roaming off: on link expiry the driver re-associated to the same AP by itself;
#   when the AP rejected that (ASSOC-REJECT status 1) the driver refused every association until
#   reloaded. With 0, expiry becomes a disconnect and wpa_supplicant does a fresh association.
#   (Soak 2026-10-13 pending — mangue-wifi-recover.timer is the safety net either way.)
options 8723ds rtw_power_mgnt=0 rtw_ips_mode=0 rtw_max_roaming_times=0
