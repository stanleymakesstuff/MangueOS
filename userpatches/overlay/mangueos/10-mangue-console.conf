# Mangue OS: only kernel errors and worse on the consoles (HDMI tty1, serial ttyS0). Info/notice lines
# (e.g. the HDMI driver's hot-plug messages) were printed over the login prompt. Everything is still in
# dmesg and the journal; early boot (before systemd-sysctl) keeps the full serial log for debugging.
# One boot only, more on the console: add loglevel=7 to the extlinux append line.
kernel.printk = 4 4 1 7
